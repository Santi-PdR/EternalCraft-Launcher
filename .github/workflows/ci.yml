name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push and pull_request events on the same branch share one build slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  native-build:
    name: Native bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles deb,rpm
      - if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eternalcraft-launcher-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
