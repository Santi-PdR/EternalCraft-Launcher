name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Push and pull_request events on the same branch share one build slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  native-build:
    name: Native bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles deb,rpm
      - if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          shopt -s nullglob
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          rpm=(src-tauri/target/release/bundle/rpm/*.rpm)
          [[ ${#deb[@]} -eq 1 ]] || { echo "Expected one .deb package, found ${#deb[@]}"; exit 1; }
          [[ ${#rpm[@]} -eq 1 ]] || { echo "Expected one .rpm package, found ${#rpm[@]}"; exit 1; }
          for package in "${deb[0]}" "${rpm[0]}"; do
            [[ -s "$package" ]] || { echo "Package is empty: $package"; exit 1; }
            file "$package"
          done
          file "${deb[0]}" | grep -F "Debian binary package"
          file "${rpm[0]}" | grep -F "RPM"
          deb_contents="$(dpkg-deb --contents "${deb[0]}")"
          printf '%s\n' "$deb_contents" | grep -E '\./usr/share/applications/[^/]+\.desktop$'
          rpm_contents="$(rpm -qpl "${rpm[0]}")"
          printf '%s\n' "$rpm_contents" | grep -E '^/usr/share/applications/[^/]+\.desktop$'
          rpm_executables="$(rpm -qplv "${rpm[0]}" | grep -E '^-[rwxstST-]{9} .*x.* /' || true)"
          [[ -n "$rpm_executables" ]] || { echo "RPM does not contain an executable file"; exit 1; }
          printf '%s\n' "$rpm_executables"
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb --extract "${deb[0]}" "$extracted"
          launcher_binary=""
          while IFS= read -r candidate; do
            if file "$candidate" | grep -q "ELF"; then
              launcher_binary="$candidate"
              break
            fi
          done < <(find -L "$extracted" -type f -executable)
          [[ -n "$launcher_binary" ]] || { echo "No executable ELF binary found in the Debian package"; exit 1; }
          file "$launcher_binary" | grep -F "ELF"
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS setup executable, found $($installers.Count)" }
          $installer = $installers[0]
          if ($installer.Length -lt 1MB) { throw "NSIS setup executable is unexpectedly small: $($installer.Length) bytes" }
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $header = New-Object byte[] 2
            [void]$stream.Read($header, 0, 2)
          } finally {
            $stream.Dispose()
          }
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) { throw "NSIS setup is not a Windows PE executable" }
          Write-Output "$($installer.Name): $($installer.Length) bytes; PE header valid"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eternalcraft-launcher-${{ runner.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
